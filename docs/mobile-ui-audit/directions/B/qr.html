  panel.innerHTML=scanning?'<p class="qr-person">Ayşe Yılmaz</p><p class="qr-location">NGS Teknoloji — Merkez</p><div class="scan-panel" role="img" aria-label="QR tarama çerçevesi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5M3 12h18"/></svg></div><p class="instruction">QR kodu çerçeveye alın</p>':original;
 };
 tabs.forEach((tab,i)=>tab.addEventListener('click',()=>{location.hash=i?'tara':'kodum'}));
 window.addEventListener('hashchange',render);render();
}
</script></body></html>
