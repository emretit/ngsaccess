# NgAccess self-host Convex (PROVA 2026-11-28) — repo: infra/convex-selfhost/nginx-ngs-convex.conf
# api.ngsplus.app  -> 127.0.0.1:3210 (Convex API + sync WebSocket)
# site.ngsplus.app -> 127.0.0.1:3211 (HTTP actions + Convex Auth)
# Dashboard (127.0.0.1:6791) BİLEREK dışarı açılmaz.
# Log'da $request_uri değil $uri: sorgu dizgisindeki olası bilet/token log'a düşmesin.
log_format ngs_convex '$remote_addr [$time_local] "$request_method $host$uri $server_protocol" '
                      '$status $body_bytes_sent $request_time $upstream_response_time';

# Varsayılan vhost'taki $connection_upgrade map'ine dokunmamak için ayrı ad.
map $http_upgrade $ngs_convex_conn_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ngsplus.app site.ngsplus.app;
    access_log /var/log/nginx/ngs-convex.access.log ngs_convex;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.ngsplus.app;
    ssl_certificate /etc/letsencrypt/live/api.ngsplus.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ngsplus.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/ngs-convex.access.log ngs_convex;
    error_log /var/log/nginx/ngs-convex.error.log warn;

    client_max_body_size 100m;   # convex deploy/import + storage upload

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ngs_convex_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name site.ngsplus.app;
    ssl_certificate /etc/letsencrypt/live/site.ngsplus.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.ngsplus.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/ngs-convex.access.log ngs_convex;
    error_log /var/log/nginx/ngs-convex.error.log warn;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3211;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ngs_convex_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
