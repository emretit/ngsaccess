# http bağlamında yüklenir (ör. sites-enabled); $request ve $request_uri bilet sızdırır.
log_format hik_relay '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';
# Kimliksiz bağlantı/401 seline karşı IP başına sınır (yalnız stream; wake'i relay HMAC + 30/dk ile sınırlar,
# Convex çıkış IP'leri paylaşımlı olduğundan orada nginx sınırı uygulanmaz).
limit_req_zone $binary_remote_addr zone=hik_relay_stream:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=hik_relay_conn:1m;

server {
    listen 80;
    server_name relay.ngsplus.app;
    access_log /var/log/nginx/hik-relay.access.log hik_relay;
    error_log /var/log/nginx/hik-relay.error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Sertifika alındıktan sonra etkinleştir; ilk kurulum sırası RUNBOOK.md içinde.
server {
    listen 443 ssl;
    server_name relay.ngsplus.app;
    ssl_certificate /etc/letsencrypt/live/relay.ngsplus.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.ngsplus.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/hik-relay.access.log hik_relay;
    # Hata satırları istek satırını (bileti) içerebilir; dosya yalnız root okunur ve bilet yalnız
    # "uyan" sinyalini dinletir (veri sızdırmaz) — sorun giderme görünürlüğü için açık tutulur.
    error_log /var/log/nginx/hik-relay.error.log warn;

    location = /hik-bridge/stream {
        limit_req zone=hik_relay_stream burst=10 nodelay;
        limit_conn hik_relay_conn 10;
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /hik-bridge/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / {
        return 404;
    }
}
