# NGS Access — Mosquitto config (eclipse-mosquitto:2)
# RUNBOOK: infra/mqtt/RUNBOOK.md

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type notice
log_type information
log_timestamp true

# Global: anonim erişim kapalı, parola dosyası + ACL.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# ── Listener 1: TLS 8883 — paneller (internet) ──────────────────────
# Panel SSL_SELF_SIGNED=1 ile bağlanır; sunucu sertifikası kendi CA'mızca imzalı.
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# Panel istemci sertifikası SUNMAZ (yalnızca username/password) → mTLS kapalı.
require_certificate false
tls_version tlsv1.2

# ── Listener 2: plaintext 1883 — bridge daemon (loopback) ───────────
# docker-compose 1883'ü 127.0.0.1'e bind eder; dünyaya kapalı.
# Yine de parola/ACL geçerli (allow_anonymous false global).
listener 1883 0.0.0.0
protocol mqtt
