# NGS MQTT secure rollout target; not evidence of deployed broker state.
# Panels require verified TLS on 8883. Bridge plaintext is host-loopback only.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ngs-mqtt
    restart: unless-stopped
    ports:
      - "8883:8883"   # TLS — CA upload çözülünce paneller buraya (UFW + auth + TLS)
      - "127.0.0.1:1883:1883" # bridge only; never expose publicly
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/acl:/mosquitto/config/acl:ro
      - ./secrets/passwd:/mosquitto/config/passwd:ro
      - ./certs:/mosquitto/certs:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    healthcheck:
      # Broker process'i ayakta mı (1883 loopback dinliyor mu).
      test: ["CMD-SHELL", "timeout 3 mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 2>/dev/null; [ $$? -ne 124 ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mqtt-data:
  mqtt-log:
