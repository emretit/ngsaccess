name: Mobile quality and native compilation
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      verify_android_upload:
        description: Build and verify an upload-signed bundle (never publish)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
# Compile-only backend destination. These jobs never use a real employee account.
env:
  APP_ENV: staging
  CONVEX_URL: https://ci-build-only.invalid
  CONVEX_ALLOWED_HOST: ci-build-only.invalid
jobs:
  dart-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - id: pin
        run: python3 -c 'import json,os; p=json.load(open("release/toolchain.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("flutter="+p["flutter"]+"\n")'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.flutter }}
          channel: stable
          cache: true
          cache-key: flutter-android-${{ steps.pin.outputs.flutter }}-${{ hashFiles('mobile/pubspec.lock') }}
      - name: Restore exact Dart graph
        run: flutter pub get --enforce-lockfile
      - name: Generated translations and lock drift
        run: |
          python3 scripts/check_l10n.py
          flutter gen-l10n
          git diff --exit-code -- pubspec.lock lib/l10n
      - name: Static analysis and behavioral regression tests
        run: |
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
          python3 -m unittest discover -s scripts/tests -v
      - name: Install declared Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unsigned release compilation and APK inspection
        run: scripts/build_mobile.sh android-unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-compile-evidence
          path: mobile/build/release-evidence/
          retention-days: 14

  ios-compile:
    runs-on: macos-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - id: pin
        run: python3 -c 'import json,os; p=json.load(open("release/toolchain.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("flutter="+p["flutter"]+"\n")'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.flutter }}
          channel: stable
          cache: true
          cache-key: flutter-ios-${{ steps.pin.outputs.flutter }}-${{ hashFiles('mobile/pubspec.lock', 'mobile/ios/Podfile.lock') }}
      - name: Verify Xcode release toolchain
        run: python3 scripts/check_apple_tools.py
      - name: Install CocoaPods fallback version
        run: gem install cocoapods -v 1.16.2 --no-document
      - run: flutter pub get --enforce-lockfile
      - name: Simulator and unsigned device compilation
        run: |
          scripts/build_mobile.sh ios-simulator
          scripts/build_mobile.sh ios-nosign
          git diff --exit-code -- pubspec.lock ios/Podfile.lock ios/Runner.xcodeproj/project.pbxproj
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-compile-evidence
          path: mobile/build/release-evidence/
          retention-days: 14

  android-upload-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_android_upload
    needs: dart-and-android
    environment: mobile-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      APP_ENV: production
      CONVEX_URL: ${{ vars.MOBILE_CONVEX_URL }}
      CONVEX_ALLOWED_HOST: ${{ vars.MOBILE_CONVEX_ALLOWED_HOST }}
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ngs-upload.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_EXPECTED_CERT_SHA256: ${{ vars.ANDROID_EXPECTED_CERT_SHA256 }}
      BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
    steps:
      - uses: actions/checkout@v6
      - id: pin
        run: python3 -c 'import json,os; p=json.load(open("release/toolchain.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("flutter="+p["flutter"]+"\n")'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.flutter }}
          channel: stable
      - name: Materialize upload key without logging values
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: python3 scripts/prepare_upload_key.py
      - name: Fetch pinned bundletool with owner-approved checksum
        env:
          BUNDLETOOL_SHA256: ${{ vars.BUNDLETOOL_1_18_2_SHA256 }}
        run: python3 scripts/fetch_bundletool.py
      - run: flutter pub get --enforce-lockfile
      - name: Upload-signed build and final bundle inspection
        run: scripts/build_mobile.sh android-release
      - uses: actions/upload-artifact@v4
        with:
          name: android-upload-signature-evidence
          path: mobile/build/release-evidence/
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: python3 -c 'import os; from pathlib import Path; Path(os.environ["ANDROID_KEYSTORE_PATH"]).unlink(missing_ok=True)'
